apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsecart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pulsecart
  template:
    metadata:
      labels:
        app: pulsecart
    spec:
      containers:
        - name: pulsecart
          image: pulsecart:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pulsecart-service
spec:
  type: NodePort
  selector:
    app: pulsecart
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
